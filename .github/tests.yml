name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, pcntl, pdo_mysql, redis

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Setup Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint
        run: ./vendor/bin/pint --test

      - name: Pest
        run: ./vendor/bin/pest

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=1G
