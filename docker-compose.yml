services:
    app:
        build:
            context: .
            dockerfile: Dockerfile

        container_name: laravel-test-app

        volumes:
            - .:/var/www

        networks:
            - laravel-test

    nginx:
        image: nginx:latest

        container_name: laravel-test-nginx

        ports:
            - "80:80"

        volumes:
            - .:/var/www:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

        depends_on:
            - app

        networks:
            - laravel-test
    mysql:
        image: mysql:8.2
        container_name: laravel-test-mysql
        environment:
            MYSQL_DATABASE: laravel_test
            MYSQL_USER: laravel
            MYSQL_PASSWORD: laravel
            MYSQL_ROOT_PASSWORD: root
        ports:
            - "3307:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - laravel-test
    redis:
        image: redis:latest
        container_name: laravel-test-redis
        networks:
            - laravel-test
    mailpit:
        image: axllent/mailpit:latest
        container_name: laravel-test-mailpit
        ports:
            - "8025:8025"
            - "1025:1025"
        networks:
            - laravel-test
    supervisor:
        container_name: laravel-test-supervisor
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - .:/var/www
            - ./docker/supervisor/supervisor.conf:/etc/supervisor/conf.d/laravel-worker.conf
        command: >
            sh -c "
            mkdir -p /var/www/storage/logs/supervisor &&
            touch /var/www/storage/logs/supervisor/supervisord.log &&
            /usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf
            "
        depends_on:
            - redis
        networks:
            - laravel-test
networks:
    laravel-test:
        driver: bridge
volumes:
    mysql-data:
